<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Desk — Disaster Alerts</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <span class="pulse" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Public safety feed</p>
          <h1>Signal Desk</h1>
        </div>
      </div>
      <nav class="actions">
        <span id="user-chip" class="user-chip hidden"></span>
        <button id="btn-new" class="btn btn-primary hidden" type="button">Post alert</button>
        <button id="btn-login" class="btn" type="button">Sign in</button>
        <button id="btn-register" class="btn" type="button">Register</button>
        <button id="btn-logout" class="btn hidden" type="button">Sign out</button>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="kicker">Live bulletin</p>
        <h2>Disaster alerts for crews and communities</h2>
        <p class="lede">
          Browse verified notices by severity. Signed-in reporters can publish updates with
          optional field photos stored on Cloudflare R2.
        </p>
      </section>

      <section class="filters" aria-label="Filter by severity">
        <button class="chip active" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="critical" type="button">Critical</button>
        <button class="chip" data-filter="warning" type="button">Warning</button>
        <button class="chip" data-filter="info" type="button">Info</button>
      </section>

      <p id="status" class="status" role="status"></p>
      <section id="feed" class="feed" aria-live="polite"></section>
    </main>

    <dialog id="auth-dialog" class="modal">
      <form id="auth-form" method="dialog">
        <h3 id="auth-title">Sign in</h3>
        <p class="hint" id="auth-hint">Use your email to access posting tools.</p>
        <label>
          Name
          <input id="auth-name" name="name" autocomplete="name" />
        </label>
        <label>
          Email
          <input id="auth-email" name="email" type="email" required autocomplete="email" />
        </label>
        <label>
          Password
          <input id="auth-password" name="password" type="password" required minlength="8" autocomplete="current-password" />
        </label>
        <p id="auth-error" class="form-error"></p>
        <menu>
          <button value="cancel" type="button" id="auth-cancel" class="btn">Cancel</button>
          <button id="auth-submit" class="btn btn-primary" type="submit">Continue</button>
        </menu>
      </form>
    </dialog>

    <dialog id="post-dialog" class="modal">
      <form id="post-form">
        <h3>Publish an alert</h3>
        <label>
          Title
          <input id="post-title" name="title" required minlength="3" maxlength="140" />
        </label>
        <label>
          Severity
          <select id="post-severity" name="severity" required>
            <option value="info">Info</option>
            <option value="warning" selected>Warning</option>
            <option value="critical">Critical</option>
          </select>
        </label>
        <label>
          Details
          <textarea id="post-content" name="content" required minlength="10" maxlength="8000" rows="6"></textarea>
        </label>
        <label>
          Photo (optional)
          <input id="post-image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
        </label>
        <p id="post-error" class="form-error"></p>
        <menu>
          <button type="button" id="post-cancel" class="btn">Cancel</button>
          <button class="btn btn-primary" type="submit">Publish</button>
        </menu>
      </form>
    </dialog>

    <dialog id="detail-dialog" class="modal wide">
      <article id="detail-body"></article>
      <menu>
        <button type="button" id="detail-close" class="btn">Close</button>
      </menu>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
